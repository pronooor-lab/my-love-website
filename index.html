<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মন কথা ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#160018,#430b35,#100016);color:white;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px}
.container{width:100%;max-width:430px;padding:30px 22px;border-radius:25px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);box-shadow:0 0 35px rgba(255,0,120,.15)}
.heart{font-size:65px;animation:beat 1s infinite;margin-bottom:15px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
h1{color:#ff8fcb;margin-bottom:15px}
p{font-size:17px;line-height:1.8;margin:15px 0}
button{border:none;border-radius:30px;padding:13px 23px;margin:8px;font-size:16px;cursor:pointer;background:#ff4fa3;color:white}
button:hover{background:#ff1687}
.hidden{display:none}
#result{margin-top:20px;color:#ffb5df;font-size:18px}
.floating-heart{position:fixed;bottom:-30px;animation:floatUp 4s linear forwards;pointer-events:none}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>

<div class="container" id="welcome">
<div class="heart">❤️</div>
<h1>একটু মন কথা বলি?</h1>
<p>তোমার জন্য কিছু কথা জমিয়ে রেখেছি।<br>সময় হলে একটু পড়ে দেখবে? 💌</p>
<button onclick="startStory()">হ্যাঁ, বলো ❤️</button>
</div>

<div class="container hidden" id="story">
<h1 id="title"></h1>
<p id="text"></p>
<button id="nextButton" onclick="nextMessage()">পরের কথা ➜</button>
</div>

<div class="container hidden" id="question">
<div class="heart">💖</div>
<h1>একটা প্রশ্ন করি?</h1>
<p>তুমি কি আমাকে ভালোবাসো? 🥺❤️</p>
<button onclick="answerYes()">হ্যাঁ ❤️</button>
<button onclick="answerNo()">না 🙂</button>
<div id="result"></div>
<button onclick="restart()">আবার শুরু করি ↻</button>
</div>

<script>
const messages=[
{title:"প্রথম কথা ❤️",text:"জানো, কিছু মানুষ জীবনে এসে অল্প সময়েই অনেক আপন হয়ে যায়। তুমি আমার কাছে তেমনই একজন।"},
{title:"তোমার হাসি 😊",text:"তোমার হাসিটা আমার কাছে খুব সুন্দর। তোমার মন ভালো থাকুক, এটাই চাই।"},
{title:"একটু অনুভূতি 💌",text:"সব কথা মুখে বলা যায় না। কিছু অনুভূতি মনের ভেতরেই থেকে যায়, ঠিক তোমাকে বলা এই কথাগুলোর মতো।"},
{title:"একটা ইচ্ছা 🌸",text:"তোমার সঙ্গে সুন্দর কিছু স্মৃতি তৈরি করতে চাই। একসঙ্গে হাসতে চাই, গল্প করতে চাই।"},
{title:"শেষ কথা 💖",text:"তোমাকে আমার ভালো লাগে। তোমার অনুভূতিও আমার কাছে গুরুত্বপূর্ণ। তাই মনের কথাটা তোমাকে জানালাম।"}
];
let current=0;

function startStory(){
document.getElementById("welcome").classList.add("hidden");
document.getElementById("story").classList.remove("hidden");
showMessage();
}

function showMessage(){
document.getElementById("title").textContent=messages[current].title;
document.getElementById("text").textContent=messages[current].text;
document.getElementById("nextButton").textContent=current===messages.length-1?"শেষ প্রশ্নটি দেখো 💗":"পরের কথা ➜";
}

function nextMessage(){
current++;
if(current<messages.length){showMessage();}
else{
document.getElementById("story").classList.add("hidden");
document.getElementById("question").classList.remove("hidden");
}
}

function answerYes(){
document.getElementById("result").textContent="তোমার উত্তরটা জেনে খুব ভালো লাগল! ❤️💖";
makeHearts();
}

function answerNo(){
document.getElementById("result").textContent="ঠিক আছে ❤️ তোমার অনুভূতিকে সম্মান করি। ভালো থেকো।";
}

function makeHearts(){
for(let i=0;i<25;i++){
setTimeout(()=>{
const heart=document.createElement("div");
heart.className="floating-heart";
heart.textContent=["❤️","💖","💕","💗"][Math.floor(Math.random()*4)];
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*20)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),4000);
},i*100);
}
}

function restart(){
current=0;
document.getElementById("question").classList.add("hidden");
document.getElementById("welcome").classList.remove("hidden");
document.getElementById("result").textContent="";
}
</script>

</body>
</html>
